<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistencia DERILACPA</title>
  <style>
    html, body { margin: 0; height: 100%; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbyIEm0Yr5JZnFKcIy5Xu7fqpjqxDuoCKV75FCGDSzPhbrD83pY4Sg2uJecI-rPNFxQidg/exec"
    allow="camera; microphone"
    allowfullscreen>
  </iframe>
  <script>
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.tipo !== 'asistencia-nav') return;
      if (typeof e.data.url !== 'string') return;
      if (e.data.url.indexOf('/exec') === -1) return;
      document.getElementById('app').src = e.data.url;
    });
  </script>
</body>
</html>
